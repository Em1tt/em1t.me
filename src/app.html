<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%" class="overscroll-y-none scroll-smooth">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#05030f" />
		<meta name="author" content="Richard Marcinčák" />

		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Google+Sans+Code:wght@400..600&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover" class="overscroll-y-none">
		<div style="display: contents">%sveltekit.body%</div>

</html>
